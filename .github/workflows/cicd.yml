name: Angular CI/CD

# Ejecuta build en las pull requests hacia main y en los pushes a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Define los trabajos de compilación y despliegue.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npx ng build --base-href /cicd-angular/

      - name: Subir los archivos compilados
        # Solo prepara la publicación cuando el cambio ya está en main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  deploy:
    # Espera a que build termine correctamente.
    needs: build
    # Publica solo en pushes a main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Permite publicar en Pages y autenticar el despliegue.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4